services:
  - type: web
    name: ricswallet
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: WEBHOOK_HMAC_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ricswallet-db
          property: connectionString
      - key: BSC_CHAIN_ID
        value: "56"
      - key: BSC_NETWORK_KEY
        value: BSC_BEP20
      - key: BSC_NETWORK_NAME
        value: BNB Smart Chain (BEP-20)
      - key: BSC_EXPLORER_URL
        value: https://bscscan.com
      - key: USDT_TOKEN_CONTRACT
        value: "0x55d398326f99059fF775485246999027B3197955"
      - key: USDT_DECIMALS
        value: "18"
      - key: MIN_DEPOSIT_USDT
        value: "3"
      - key: REQUIRED_CONFIRMATIONS
        value: "15"
      - key: INVOICE_EXPIRY_MINUTES
        value: "60"
      - key: LATE_DEPOSIT_POLICY
        value: review
      # REQUIRED FOR REAL TRANSACTIONS — Set these in the Render Dashboard:
      - key: BSC_RPC_URL
        sync: false
      - key: DEPOSIT_WALLET_XPUB
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false

databases:
  - name: ricswallet-db
    plan: basic-256mb
    databaseName: ricswallet
    user: ricswallet
